# 粗利計算と判定の前提。🧑 マークの項目は人間が決めて更新する。

[fx]
# 人民元→円の換算レート。仕入れ時に実レート＋決済手数料を上乗せした値に更新する
cny_jpy = 22.0

[thresholds]
min_margin_rate = 0.30
min_profit_jpy = 500
# 🧑 MVP全体の予算上限（サンプル代＋テスト仕入れ）
budget_total_jpy = 100000

[costs]
# 販売価格に対する広告費の割合（テスト販売では高めに見積もる）
ad_rate = 0.10
# 返品・不良に備える引当の割合
return_rate = 0.03
# 輸入消費税（国税と地方税の合計）。免税事業者の間は仕入れ控除できないため、原価に含める
import_consumption_tax_rate = 0.10

[amazon]
# カテゴリ別の販売手数料率。参考値なので、セラーセントラルの最新の手数料表で必ず確認すること
default_referral_rate = 0.15

[amazon.referral_rates]
"スポーツ&アウトドア" = 0.10
"ホーム&キッチン" = 0.15
"DIY・工具" = 0.15
"ペット用品" = 0.15
"ホビー" = 0.10
