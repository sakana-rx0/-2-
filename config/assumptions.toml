# 粗利計算と判定の前提。🧑 マークの項目は人間が決めて更新する。

[fx]
# 人民元→円の換算レート。仕入れ時に実レート＋決済手数料を上乗せした値に更新する
cny_jpy = 22.0

[thresholds]
min_margin_rate = 0.30
min_profit_jpy = 500
# 🧑 MVP全体の予算上限（サンプル代＋テスト仕入れ）
budget_total_jpy = 100000

[costs]
# 販売価格に対する広告費の割合。小口出品はスポンサー広告を使えないため0。大口に切り替えたら0.10程度に
ad_rate = 0.0
# 返品・不良に備える引当の割合
return_rate = 0.03
# 輸入消費税（国税と地方税の合計）。免税事業者の間は仕入れ控除できないため、原価に含める
import_consumption_tax_rate = 0.10

[amazon]
# 小口出品の基本成約料（1点売れるごと）。大口に切り替えたら0にする
per_item_fee_jpy = 100
# カテゴリ別の販売手数料率。参考値なので、セラーセントラルの最新の手数料表で必ず確認すること
default_referral_rate = 0.15

[amazon.referral_rates]
"スポーツ&アウトドア" = 0.10
"ホーム&キッチン" = 0.15
"DIY・工具" = 0.15
"ペット用品" = 0.15
"ホビー" = 0.10

# 事業判断のパラメータ（docs/hurdles.md）。変更するときは同文書の変更ルールに従い、data/decisions.md に記録する
[hurdles]
stage1_min_realized_margin = 0.20
# ②③共通：実質時給（事業利益 ÷ 作業時間）の下限
min_hourly_jpy = 5000
stage2_consecutive_months = 2
stage3_min_monthly_profit_jpy = 100000
stage3_consecutive_months = 3

# 月額の固定費。🧑 実際の契約に合わせて更新する
[fixed_costs]
# Claude Max（20xプラン）。他の用途と共用でも、保守的に全額を計上する
claude_jpy = 42500
# 大口出品の月額。小口の間は0、切り替えたら4900
amazon_pro_jpy = 0
other_jpy = 0
